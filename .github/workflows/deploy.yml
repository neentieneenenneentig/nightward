name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust/wasm toolchain first — `npm run build` runs `npm run wasm` (wasm-pack)
      # before vite, so the compiler + wasm32 target must be present.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/nightward-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # ---- release gate -------------------------------------------------
      # Nothing reaches the public page without passing in a real browser
      # against this exact `dist/`. Before this existed, `main` deployed
      # whatever compiled.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: QA gate — smoke, Gauntlet and timed playthroughs on the built bundle
        env:
          NW_SKIP_BUILD: '1'
        run: npm run qa
      - name: Keep the traces even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-traces-${{ github.run_id }}
          path: |
            qa/.report
            qa/.artifacts
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
