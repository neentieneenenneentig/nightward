name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Rust core must exist before anything typechecks: src/wasm/pkg/ is
      # gitignored and regenerated by `npm run wasm` (WORKFLOW.md pitfall 1).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/nightward-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---- L1: static ----
      - name: Rust core tests
        run: cargo test --manifest-path rust/nightward-core/Cargo.toml
      - name: Build the wasm core
        run: npm run wasm
      - name: Typecheck the game
        run: npm run typecheck
      - name: Typecheck the QA harness
        run: npm run typecheck:qa
      - name: Production build
        run: npx vite build

      # ---- L3: the shipped bundle, in a real browser ----
      # Only the webgl lane runs here: it uses ANGLE/SwiftShader, so it behaves
      # identically on a GPU-less runner. The webgpu lane is headed and belongs
      # to the pre-release sweep.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke + Gauntlet on the built bundle
        env:
          NW_SKIP_BUILD: '1'
        run: npx playwright test --project=webgl qa/specs/smoke.spec.ts qa/specs/gauntlet.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-traces-${{ github.run_id }}
          path: |
            qa/.report
            qa/.artifacts
          retention-days: 14
          if-no-files-found: ignore
