<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b47" />
  <title>NIGHTWARD</title>
  <!-- Pillar 1 is "100% procgen, no hosted assets", and that has to include the
       tab. An inline SVG data URI ships no file and fetches nothing: a ward
       around a hearth-ember. Without it the browser requests /favicon.ico by
       itself, which 404s — invisible in headless Chrome, but the headed WebGPU
       lane asks for it and the QA harness counts every console error. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d2b47'/%3E%3Cpath d='M8 1.5 L13.5 8 L8 14.5 L2.5 8 Z' fill='none' stroke='%23dfe6f0' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='1.6' fill='%23e8c34a'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      /* dvh (dynamic viewport height) — avoids iOS Safari address bar layout shifts.
         Falls back to vh on older browsers. */
      height: 100vh; height: 100dvh;
      background: #0d2b47;
      overflow: hidden;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }
    #app, #app canvas { position: fixed; inset: 0; }

    #hud { position: fixed; inset: 0; pointer-events: none; color: #dfe6f0; z-index: 10; }

    /* floating virtual joystick (touch only, appears where you press) */
    .stick { position: fixed; border-radius: 50%; pointer-events: none; z-index: 20; display: none; }
    #stick-base {
      width: 96px; height: 96px; margin: -48px 0 0 -48px;
      border: 2px solid #dfe6f055; background: #12345633;
    }
    #stick-knob {
      width: 44px; height: 44px; margin: -22px 0 0 -22px;
      background: #dfe6f0aa; box-shadow: 0 0 12px #3b82c4aa;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
